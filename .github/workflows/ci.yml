name: Continuous Integration & Test Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run 10-Suite Regression Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'standalone/package-lock.json'

      - name: Install Dependencies
        working-directory: standalone
        run: npm ci

      - name: Execute Full Test Suite (210 Assertions)
        working-directory: standalone
        run: npm test
