name: Build & Release Hell Fire Browser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Setup & Portable Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'standalone/package-lock.json'

      - name: Install Dependencies
        working-directory: standalone
        run: npm ci

      - name: Run Test Verification Suite
        working-directory: standalone
        run: npm test

      - name: Build Windows Executable & NSIS Installer
        working-directory: standalone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Hell Fire Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            standalone/dist/*.exe
            standalone/dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
